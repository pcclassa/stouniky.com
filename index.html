*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{

  color:#1F1D1A;
  display:grid;place-items:center;
  overflow:hidden;
  background:#E9E8E5;

svg.field{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{

.bobo{
  position:fixed;z-index:1;

  width:clamp(150px,24vw,300px);
  filter:drop-shadow(0 10px 16px rgba(31,29,26,.3));
  transform-origin:50% 90%;
  animation:rise 1s cubic-bezier(.2,.8,.3,1) .4s both, sway 7s ease-in-out 1.6s infinite;
}
@keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
@keyframes sway{0%,100%{rotate:-1.6deg}50%{rotate:1.6deg}}
@media(prefers-reduced-motion:reduce){main{animation:none}.bobo{animation:none}}
h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.tagline{

.msg{font-size:1.1rem;line-height:1.6;font-weight:500}
.msg + .msg{margin-top:18px;padding-top:18px;border-top:1px solid #1F1D1A22;color:#4A463F}
.msg .em{color:#7A5C36}
.contact{margin-top:30px;font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:#5C574F}
.contact a{color:#5C574F;text-decoration-color:#7A5C36;text-underline-offset:3px}
.contact a:hover{color:#7A5C36}
