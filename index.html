/* tenký hnědý rám s přechodem tmavší nahoře, světlejší dole */
.frame{
  position:fixed;inset:0;z-index:6;pointer-events:none;
  border:5px solid transparent;
  border-image:linear-gradient(180deg,#3E2C1C 0%,#6B4E32 45%,#C9A87A 100%) 1;
}
/* Fus Bobo vykukuje zpoza horního okraje karty */
.stage{position:relative;z-index:3}
.bobo{
  position:absolute;z-index:0;
  --w:clamp(140px,20vw,210px);
  width:var(--w);
  top:calc(var(--w) * -0.78);
  right:clamp(4px,3vw,28px);
  transform:rotate(6deg);
  filter:drop-shadow(0 10px 18px rgba(25,18,10,.4));
  animation:peek 1.1s cubic-bezier(.2,.8,.3,1) .4s both;
}
@keyframes peek{from{opacity:0;transform:rotate(6deg) translateY(34px)}to{opacity:1;transform:rotate(6deg) translateY(0)}}
.card{
  position:relative;z-index:1;
  max-width:min(560px,88vw);
  background:rgba(250,247,240,.93);
  border-radius:18px;
  padding:44px 46px 38px;
  box-shadow:0 24px 60px rgba(25,18,10,.45), 0 2px 8px rgba(25,18,10,.22);
  text-align:center;
  animation:settle .9s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes settle{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card,.bobo{animation:none}}
h1{
  font-size:clamp(2rem,6vw,2.9rem);font-weight:700;letter-spacing:-.01em;
  margin-bottom:6px;
}
.tagline{
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;letter-spacing:.16em;
  text-transform:uppercase;color:#8A6B3F;margin-bottom:26px;
}
.msg{font-size:1.08rem;line-height:1.6;font-weight:500}
.msg + .msg{margin-top:16px;padding-top:16px;border-top:1px solid #E0D8C8;color:#5A5347;font-weight:500}
.msg .em{color:#8A6B3F}
.contact{
  margin-top:28px;font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:#6B6357;
}
.contact a{color:#6B6357;text-decoration-color:#B98A4E;text-underline-offset:3px}
.contact a:hover{color:#8A6B3F}
@media(max-width:520px){
  .card{padding:36px 26px 30px}
}
</style>
</head>
