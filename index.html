*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{

  color:#2E2A23;
  display:grid;place-items:center;
  overflow:hidden;
  background:#7C7466;
}
svg.pebbles{

}
.card{
  position:relative;z-index:1;
  max-width:min(560px,90vw);
  background:rgba(250,247,240,.92);
  border-radius:18px;
  padding:44px 46px 38px;
  box-shadow:0 24px 60px rgba(30,26,20,.35), 0 2px 8px rgba(30,26,20,.18);
  text-align:center;
  animation:settle .9s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes settle{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
h1{
  font-size:clamp(2rem,6vw,2.9rem);font-weight:700;letter-spacing:-.01em;
  margin-bottom:6px;
}
.tagline{
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;letter-spacing:.16em;
  text-transform:uppercase;color:#8A6B3F;margin-bottom:26px;
}
.msg{font-size:1.08rem;line-height:1.6;font-weight:500}
.msg + .msg{margin-top:16px;padding-top:16px;border-top:1px solid #E0D8C8;color:#5A5347;font-weight:500}
.msg .em{color:#8A6B3F}
.contact{
  margin-top:28px;font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:#6B6357;
}
.contact a{color:#6B6357;text-decoration-color:#B98A4E;text-underline-offset:3px}
.contact a:hover{color:#8A6B3F}
