/* tenký hnědý rám s přechodem tmavší nahoře, světlejší dole */
.frame{
  position:fixed;inset:0;z-index:6;pointer-events:none;
  border:5px solid transparent;
  border-image:linear-gradient(180deg,#3E2C1C 0%,#6B4E32 45%,#C9A87A 100%) 1;
}
/* Fus Bobo a Uska vykukují z rohů */
.bobo{
  position:fixed;z-index:2;
  bottom:-3%;right:-2%;
  width:clamp(160px,26vw,320px);
  transform:rotate(-7deg);
  transform-origin:80% 100%;
  filter:drop-shadow(0 12px 20px rgba(25,18,10,.45));
  animation:rise 1s cubic-bezier(.2,.8,.3,1) .4s both, sway 7s ease-in-out 1.6s infinite;
}
@keyframes rise{from{opacity:0;transform:rotate(-7deg) translateY(70px)}to{opacity:1;transform:rotate(-7deg) translateY(0)}}
@keyframes sway{0%,100%{rotate:-8.2deg}50%{rotate:-5.8deg}}
.uska{
  position:fixed;z-index:2;
  top:-3%;left:-2%;
  width:clamp(120px,20vw,240px);
  transform:rotate(8deg);
  transform-origin:20% 0%;
  filter:drop-shadow(0 12px 20px rgba(25,18,10,.45));
  animation:drop 1s cubic-bezier(.2,.8,.3,1) .8s both, swayb 8s ease-in-out 2s infinite;
}
@keyframes drop{from{opacity:0;transform:rotate(8deg) translateY(-70px)}to{opacity:1;transform:rotate(8deg) translateY(0)}}
@keyframes swayb{0%,100%{rotate:9.2deg}50%{rotate:6.8deg}}
.card{
  position:relative;z-index:1;
  max-width:min(560px,88vw);
  background:rgba(250,247,240,.93);
  border-radius:18px;
  padding:44px 46px 38px;
  box-shadow:0 24px 60px rgba(25,18,10,.45), 0 2px 8px rgba(25,18,10,.22);
  text-align:center;
  animation:settle .9s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes settle{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card,.bobo{animation:none}}
h1{
  font-size:clamp(2rem,6vw,2.9rem);font-weight:700;letter-spacing:-.01em;
  margin-bottom:6px;
}
.tagline{
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;letter-spacing:.16em;
  text-transform:uppercase;color:#8A6B3F;margin-bottom:26px;
}
